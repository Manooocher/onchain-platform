# Day 0 infrastructure (ImplementationPlan § Day 0): Postgres with the
# TimescaleDB extension enabled, plus Redis. The `platform` service is
# deliberately absent — there is nothing to containerize until Milestone 1
# runs locally first.
#
# Security posture (SEC-3, S0-3):
# - Both services bind to 127.0.0.1 only — never reachable off-host.
# - Postgres requires a scram-sha-256 password; Redis requires a password.
#   Both are read from .env (POSTGRES_PASSWORD / REDIS_PASSWORD) and are
#   NEVER committed. POSTGRES_DSN / REDIS_URL in .env must carry them.
# - Images are pinned to exact tags so CI, laptop, and server run the same
#   build (no floating `latest-*`).
#
# Local-dev DSN (credentials from .env):
#   postgresql+asyncpg://onchain:${POSTGRES_PASSWORD}@localhost:5433/onchain_platform
#   redis://:${REDIS_PASSWORD}@localhost:6379/0
#
# Port note: host port 5433 maps to container 5432 so this compose stack never
# collides with any other local Postgres.
#
# NOTE: switching an existing volume from trust to scram auth does not
# retro-set a password. Recreate the dev volume after setting the password:
#   docker compose down -v && docker compose up -d

services:
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg16
    container_name: onchain_platform_timescaledb
    environment:
      POSTGRES_USER: onchain
      POSTGRES_DB: onchain_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - onchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onchain -d onchain_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11-alpine
    container_name: onchain_platform_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  onchain_pgdata:
