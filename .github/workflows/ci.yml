# CI gates (DOC-010 § Code Quality Gates; S0-10). Six parallel jobs, each
# running a single Makefile target so local `make` == CI exactly:
#   lint, typecheck, imports, unit (no services),
#   integration (TimescaleDB + Redis via the repo docker-compose, pinned
#   versions from S0-3), secret-scan (gitleaks over THIS PR's commits only).
#
# Branch protection should require all six job names (see docs/implementation).

name: ci

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs of the same ref (S0-10).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: make typecheck

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: make import-check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - name: Generate ephemeral test credentials
        # No secret-looking literals in the workflow; compose + conftest read
        # these from the environment (scram password + requirepass + *_test).
        run: |
          PGPW=$(openssl rand -hex 16)
          RDPW=$(openssl rand -hex 16)
          {
            echo "POSTGRES_PASSWORD=$PGPW"
            echo "REDIS_PASSWORD=$RDPW"
            echo "POSTGRES_DSN=postgresql+asyncpg://onchain:$PGPW@localhost:5433/onchain_platform"
            echo "REDIS_URL=redis://:$RDPW@localhost:6379/0"
          } >> "$GITHUB_ENV"
      - name: Start services (pinned TimescaleDB + Redis)
        run: docker compose up -d --wait
      - name: Integration + replay tests
        run: make test-integration
      - name: Stop services
        if: always()
        run: docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks over this change's commits only
        # Scans ONLY the commits introduced by this PR/push (base..head), never
        # the full history: the already-exposed historical keys are kept live
        # on purpose (docs/implementation/S0-Notes.md) and must not fail CI.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            LOGOPTS="-1 $HEAD"
          else
            LOGOPTS="$BASE..$HEAD"
          fi
          echo "Scanning commit range: $LOGOPTS"
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="$LOGOPTS"
