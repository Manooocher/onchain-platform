# Secret-scanning gate (S0-1, SEC-1). gitleaks scans staged changes on every
# commit and blocks any commit that introduces a secret (API key, token, etc.).
#
# Setup (once per clone):
#   uv run pre-commit install
#
# Run against the whole repo on demand:
#   uv run pre-commit run --all-files
#
# We run gitleaks via its pinned Docker image (docker is already a project
# prerequisite). The upstream golang hook would make pre-commit fetch a Go
# toolchain, and the official ghcr.io image is not reliably reachable from all
# networks; the Docker Hub image is.
#
# NOTE: this gate protects *future* commits. Secrets already present in git
# history are not removed by it (see docs/implementation/S0-Notes.md); history
# was intentionally not rewritten.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        description: Block commits that introduce secrets (SEC-1).
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1 git --pre-commit --redact --staged --verbose
        pass_filenames: false
